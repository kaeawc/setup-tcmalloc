# action.yml
name: "setup-tcmalloc"
description: "An action to download, install, and cache tcmalloc on Linux runners"
author: "Jason Pearson"
inputs: {}
outputs: {}

runs:
  using: "composite"
  steps:

    - name: "Detect platform"
      if: runner.os == 'Linux'
      id: platform
      shell: bash
      run: |
        # Key the cache by distro release so a library from one Ubuntu
        # version is never restored onto another.
        . /etc/os-release
        echo "tag=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"

    - name: "Restore tcmalloc"
      if: runner.os == 'Linux'
      id: cache-tcmalloc
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.os == 'Linux' && '/tmp/libtcmalloc_minimal.so.4' }}
        key: v8-${{ runner.os }}-${{ steps.platform.outputs.tag }}-tcmalloc

    - name: "Relocate tcmalloc to expected directory"
      if: ${{ runner.os == 'Linux' && steps.cache-tcmalloc.outputs.cache-hit == 'true' }}
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Linux" ]; then
          mkdir -p /usr/lib/x86_64-linux-gnu
          sudo cp /tmp/libtcmalloc_minimal.so.4 /usr/lib/x86_64-linux-gnu/
        fi

    - name: "Download & install tcmalloc"
      if: ${{ runner.os == 'Linux' && steps.cache-tcmalloc.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Linux" ]; then
          # Install only the library package: google-perftools (the CLI tools)
          # is no longer published on Ubuntu 26.04. Ubuntu 24.04+ ships the
          # library as libtcmalloc-minimal4t64; 22.04 as libtcmalloc-minimal4.
          sudo apt-get update
          sudo apt-get install -y libtcmalloc-minimal4t64 || sudo apt-get install -y libtcmalloc-minimal4
        fi

    - name: "Configure LD_PRELOAD (or equivalent)"
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Linux" ]; then
          echo 'LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.so.4' >> $GITHUB_ENV
          mkdir -p /tmp
          cp /usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.so.4 /tmp/
        fi

    - name: "Save tcmalloc"
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      if: ${{ runner.os == 'Linux' && steps.cache-tcmalloc.outputs.cache-hit != 'true' }}
      with:
        path: ${{ runner.os == 'Linux' && '/tmp/libtcmalloc_minimal.so.4' }}
        key: v8-${{ runner.os }}-${{ steps.platform.outputs.tag }}-tcmalloc

branding:
  icon: "cpu"
  color: "blue"

